version: '3.9'

services:
  backend:
    build:
      context: ./backend/AuthApi
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=SuperSecretKey_CHANGE_IN_PRODUCTION_1234567890!!
      - Jwt__Issuer=AuthApi
      - Jwt__Audience=AuthApiUsers
    networks:
      - authnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - authnet

networks:
  authnet:
    driver: bridge
